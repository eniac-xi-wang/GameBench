<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Mindustry · 工厂回放</title>
<style>body{font:15px/1.6 system-ui;background:#101720;color:#dbe7f3;max-width:1150px;margin:30px auto;padding:0 20px}h1{font-size:25px}button,input{accent-color:#59d4ae}button{background:#234453;color:#ecfaff;border:0;padding:8px 20px;border-radius:5px;cursor:pointer}canvas{max-width:100%;background:#17222e;border:1px solid #354556}input{width:65%;vertical-align:middle}pre{white-space:pre-wrap;color:#acc7dc}.muted{color:#90a4b8}.row{display:flex;gap:24px;flex-wrap:wrap}#detail{min-width:220px}a{color:#62cfef}</style>
<h1 id="title"></h1><p id="summary"></p><div class="row"><canvas id="map" width="760" height="640"></canvas><div><strong>建筑状态</strong><pre id="detail">移动鼠标查看物品、液体和电网状态</pre><p class="muted">金色：核心<br>橙色：钻头<br>青色：物品运输<br>蓝色：液体运输与水泵<br>紫色：加工<br>黄色：供电，细线为电力连接</p><p class="muted">grid 中的 produced / needed 是<br>电网每逻辑步产电 / 需求；<br>stored 是储存电量。</p></div></div>
<p><button id="play">播放</button> <input id="seek" type="range" min="0" value="0"> <span id="time"></span></p><canvas id="chart" width="1000" height="145"></canvas>
<p class="muted">由原版引擎生成的状态回放，每 2 秒采样；交付事件逐次记录。不是原游戏画面，也不插值虚构物品运动。</p><p><a href="result.json">评分</a> · <a href="record.json">完整记录</a> · <a href="blueprint.json">提交布局</a></p>
<script>
const data=__PAYLOAD__,t=data.task,r=data.record,frames=r.frames||[],map=document.querySelector('#map'),ctx=map.getContext('2d'),seek=document.querySelector('#seek'),chart=document.querySelector('#chart'),g=chart.getContext('2d');
document.querySelector('#title').textContent='Mindustry / '+t.id;document.querySelector('#summary').textContent=r.valid?`${t.goal} 交付 ${r.score} · 建筑成本 ${r.build_cost} / ${t.budget} · ${t.ticks/60} 秒模拟`:'无效提交，0 分：'+r.error;
seek.max=Math.max(0,frames.length-1);let playing=false,index=0;const cell=Math.min(760/t.width,640/t.height);map.height=Math.ceil(cell*t.height);const colors={copper:'#ad7856',coal:'#292c36',sand:'#a59362',water:'#24558a',lead:'#76668c',titanium:'#788cc5'};
const labels={'mechanical-pump':'W','rotary-pump':'W','cultivator':'Sp','spore-press':'Oil','plastanium-compressor':'Pl','pyratite-mixer':'Py','blast-mixer':'Bl','surge-smelter':'Su','silicon-smelter':'Si','graphite-press':'G','steam-generator':'E','combustion-generator':'E','power-node':'P','solar-panel':'☀'};
function color(b){if(b.block.includes('drill'))return '#c78d53';if(/press|smelter|mixer|compressor|cultivator/.test(b.block))return '#9b83ca';if(/conduit|liquid|pump/.test(b.block))return '#63a2d9';return b.power!==undefined?'#d3c35f':'#54a6aa'}
function paint(){index=Number(seek.value);const f=frames[index];ctx.clearRect(0,0,map.width,map.height);ctx.fillStyle='#1b2934';ctx.fillRect(0,0,t.width*cell,t.height*cell);
 for(const p of t.patches){ctx.fillStyle=colors[p.item]||'#555';ctx.fillRect(p.x*cell,(t.height-p.y-p.height)*cell,p.width*cell,p.height*cell)}
 for(const [x,y] of t.obstacles){ctx.fillStyle='#667080';ctx.fillRect(x*cell,(t.height-y-1)*cell,cell,cell)}
 ctx.strokeStyle='#ffffff0c';for(let x=0;x<=t.width;x++){ctx.beginPath();ctx.moveTo(x*cell,0);ctx.lineTo(x*cell,t.height*cell);ctx.stroke()}for(let y=0;y<=t.height;y++){ctx.beginPath();ctx.moveTo(0,y*cell);ctx.lineTo(t.width*cell,y*cell);ctx.stroke()}
 ctx.fillStyle='#eab94c';ctx.fillRect((t.core.x-1)*cell,(t.height-t.core.y-2)*cell,3*cell,3*cell);ctx.fillStyle='#17222e';ctx.font=`bold ${Math.max(9,cell*.8)}px system-ui`;ctx.fillText('CORE',(t.core.x-1)*cell+2,(t.height-t.core.y)*cell);
 ctx.strokeStyle='#d3c35f77';for(const b of f?.buildings||[]){for(const [lx,ly] of b.links||[]){const other=f.buildings.find(v=>v.x===lx&&v.y===ly),d=other&&other.size%2===0?1:.5;ctx.beginPath();ctx.moveTo((b.x+.5)*cell,(t.height-b.y-.5)*cell);ctx.lineTo((lx+d)*cell,(t.height-ly-d)*cell);ctx.stroke()}}
 for(const b of f?.buildings||[]){const off=-Math.floor((b.size-1)/2),x=(b.x+off)*cell,y=(t.height-b.y-off-b.size)*cell;ctx.fillStyle=color(b);ctx.fillRect(x+1,y+1,b.size*cell-2,b.size*cell-2);ctx.fillStyle='#14202c';ctx.font=`${Math.max(8,cell*.65)}px system-ui`;ctx.fillText(b.block.includes('conveyor')||b.block.includes('conduit')?['→','↑','←','↓'][b.rotation]:b.block.includes('drill')?'D':labels[b.block]||b.block.slice(0,1).toUpperCase(),x+cell*.2,y+cell*.8);if(Object.keys(b.items).length){ctx.fillStyle='#fff';ctx.fillRect(x+2,y+b.size*cell-4,Math.min(b.size*cell-4,Object.values(b.items).reduce((a,b)=>a+b,0)*2),2)}if(Object.keys(b.liquids||{}).length){ctx.fillStyle='#73e1ff';ctx.fillRect(x+2,y+b.size*cell-7,Math.min(b.size*cell-4,Object.values(b.liquids).reduce((a,b)=>a+b,0)),2)}}
 document.querySelector('#time').textContent=`${(f?.tick||0)/60}s · ${(f?.core||{})[t.goal]||0} 个`;g.clearRect(0,0,1000,145);g.strokeStyle='#59d4ae';g.beginPath();g.moveTo(20,125);for(const e of r.deliveries||[]){if(e.tick>(f?.tick||0))break;g.lineTo(20+960*e.tick/t.ticks,125-105*e.count/Math.max(1,r.score))}g.stroke();g.fillStyle='#bdd2e2';g.fillText('核心累计目标物品',20,15);}
seek.oninput=paint;document.querySelector('#play').onclick=()=>{playing=!playing;document.querySelector('#play').textContent=playing?'暂停':'播放'};setInterval(()=>{if(playing){seek.value=(Number(seek.value)+1)%Math.max(1,frames.length);paint()}},140);
map.onmousemove=e=>{const q=map.getBoundingClientRect(),x=(e.clientX-q.left)*map.width/q.width/cell,y=t.height-(e.clientY-q.top)*map.height/q.height/cell;const b=(frames[index]?.buildings||[]).find(b=>{const o=-Math.floor((b.size-1)/2);return x>=b.x+o&&x<b.x+o+b.size&&y>=b.y+o&&y<b.y+o+b.size});document.querySelector('#detail').textContent=b?JSON.stringify(b,null,2):`(${Math.floor(x)}, ${Math.floor(y)})`;};paint();
</script></html>
