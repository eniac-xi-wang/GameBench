<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>2048 回放</title><style>
body{font:16px/1.6 system-ui,sans-serif;background:#faf8ef;color:#574f47;max-width:650px;margin:36px auto;padding:0 20px}h1{font-size:30px}#grid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;padding:10px;background:#bbada0;border-radius:8px;max-width:440px;margin:24px 0}.cell{aspect-ratio:1;display:flex;align-items:center;justify-content:center;font-weight:750;font-size:clamp(20px,5vw,34px);border-radius:5px;background:#cdc1b4}.spawn{outline:4px solid #287d9b;outline-offset:-4px}button{padding:9px 14px;margin:4px;border:0;border-radius:5px;background:#8f7a66;color:white;font:inherit;cursor:pointer}input{width:100%;max-width:460px}a{color:#276c89}#meta{min-height:50px}code{overflow-wrap:anywhere}
</style><h1>2048 · 逐步回放</h1><p><a href="../index.html">返回比赛列表</a> · 原版游戏规则 · 蓝框表示本步新方块</p>
<div id="meta"></div><div id="grid"></div><input id="slider" type="range" min="0" value="0" aria-label="回放步数"><div><button id="first">起点</button><button id="prev">上一步</button><button id="play">播放</button><button id="next">下一步</button><button id="last">终点</button></div><p id="outcome"></p>
<script id="record" type="application/json">__RECORD__</script><script>
const r=JSON.parse(document.querySelector('#record').textContent),slider=document.querySelector('#slider'),grid=document.querySelector('#grid'),play=document.querySelector('#play');let index=0,timer=null;slider.max=r.steps.length;
function show(n){index=Math.max(0,Math.min(r.steps.length,n));slider.value=index;const s=index?r.steps[index-1]:{board:r.initial,score:0};grid.replaceChildren();s.board.forEach((v,i)=>{const c=document.createElement('div');c.className='cell'+(s.spawn?.index===i?' spawn':'');c.textContent=v||'';if(v){const k=Math.log2(v);c.style.background=k<3?(k===1?'#eee4da':'#ede0c8'):`hsl(${Math.max(10,42-k*2)} 80% ${Math.max(35,70-k*2)}%)`;c.style.color=k<3?'#574f47':'white';}grid.append(c);});document.querySelector('#meta').textContent=`${r.id} · 第 ${index}/${r.steps.length} 步 · 游戏得分 ${s.score} · ${index?'方向 '+['↑ 上','→ 右','↓ 下','← 左'][s.action]:'初始棋盘'}`;}
function stop(){clearInterval(timer);timer=null;play.textContent='播放';}
play.onclick=()=>{if(timer)return stop();if(index===r.steps.length)show(0);play.textContent='暂停';timer=setInterval(()=>{show(index+1);if(index===r.steps.length)stop();},120);};
slider.oninput=()=>{stop();show(Number(slider.value));};document.querySelector('#first').onclick=()=>{stop();show(0);};document.querySelector('#prev').onclick=()=>{stop();show(index-1);};document.querySelector('#next').onclick=()=>{stop();show(index+1);};document.querySelector('#last').onclick=()=>{stop();show(r.steps.length);};document.onkeydown=e=>{if(e.key==='ArrowLeft'||e.key==='ArrowRight'){e.preventDefault();stop();show(index+(e.key==='ArrowRight'?1:-1));}};
document.querySelector('#outcome').textContent=`结束：${r.termination}；计分 ${r.score}；最大方块 ${r.max_tile}${r.error?'；错误：'+r.error.message:''}`;show(0);
</script></html>
