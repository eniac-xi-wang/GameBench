<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Celeste Classic · TAS 回放</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#111827;color:#e5e7eb;font:16px system-ui,sans-serif}main{max-width:1060px;margin:40px auto;padding:24px}h1{font-size:27px;margin:0 0 8px}header p{color:#94a3b8}.layout{display:grid;grid-template-columns:minmax(280px,512px) 1fr;gap:24px;margin-top:28px}canvas{width:100%;image-rendering:pixelated;background:#000;border-radius:8px}aside{padding:20px;background:#1e293b;border-radius:12px}strong{color:#67e8f9}button,select{background:#334155;color:white;border:0;padding:10px 14px;border-radius:6px;cursor:pointer}button:focus-visible,select:focus-visible,input:focus-visible{outline:2px solid #67e8f9}nav{display:flex;gap:8px;flex-wrap:wrap;margin:12px 0}input{width:100%;accent-color:#67e8f9}pre{white-space:pre-wrap;font-size:14px;line-height:1.6;color:#cbd5e1}.hint{font-size:13px;color:#94a3b8}#keys{min-height:30px;font-weight:600;color:#fbbf24}@media(max-width:720px){.layout{grid-template-columns:1fr}main{margin:10px auto;padding:16px}}
</style><main><header><h1>Celeste Classic · 100m TAS</h1><p>逐帧回放 · 脚本输入 · 角色轨迹</p></header><div class="layout"><section><canvas id="screen" width="128" height="128" aria-label="游戏回放画面"></canvas><nav><button id="play">播放</button><button id="prev">← 前一帧</button><button id="next">后一帧 →</button><select id="speed" aria-label="播放速度"><option value="0.25">0.25×</option><option value="0.5">0.5×</option><option value="1" selected>1×</option><option value="2">2×</option></select></nav><input id="slider" type="range" min="0" value="0" aria-label="回放帧"><p id="frame"></p></section><aside><p id="score"></p><div id="keys"></div><pre id="state"></pre><p class="hint">← / → 单帧查看；空格播放或暂停。第 0 帧是起点，后续画面是执行该帧输入后的状态。回放无音频。</p><p class="hint">固定任务、种子与完整初始化。回放和评分来自同一次引擎运行。</p></aside></div></main>
<script>
const data=__DATA__;
const el=id=>document.getElementById(id),ctx=el('screen').getContext('2d');
let current=0,timer=null,generation=0;const images=data.frames.map(f=>{let im=new Image();im.src='data:image/png;base64,'+f;return im});
el('slider').max=images.length-1;
el('score').innerHTML=data.report.success?`完成 · <strong>${data.report.completion_frames} 帧</strong> / ${(data.report.completion_frames/30).toFixed(3)} 秒`:'尚未完成关卡';
function draw(i){current=Math.max(0,Math.min(images.length-1,i));const epoch=++generation,im=images[current];const paint=()=>{if(epoch===generation)ctx.drawImage(im,0,0)};if(im.complete)paint();else im.onload=paint;el('slider').value=current;el('frame').textContent=`第 ${current} / ${images.length-1} 帧`;const row=data.trace[current];el('keys').textContent=current===0?'起点':Object.entries(data.buttons).filter(([k,v])=>row.input&v).map(([k])=>k).join(' + ')||'无按键';el('state').textContent=JSON.stringify(row,null,2)}
function stop(){clearInterval(timer);timer=null;el('play').textContent='播放'}
function play(){if(timer){stop();return}if(current===images.length-1)draw(0);el('play').textContent='暂停';timer=setInterval(()=>{if(current===images.length-1)stop();else draw(current+1)},1000/30/Number(el('speed').value))}
el('play').onclick=play;el('prev').onclick=()=>{stop();draw(current-1)};el('next').onclick=()=>{stop();draw(current+1)};el('slider').oninput=e=>{stop();draw(Number(e.target.value))};el('speed').onchange=()=>{if(timer){stop();play()}};document.onkeydown=e=>{if(e.target.tagName==='INPUT'||e.target.tagName==='SELECT')return;if(e.code==='Space'){e.preventDefault();play()}if(e.code==='ArrowLeft'){e.preventDefault();stop();draw(current-1)}if(e.code==='ArrowRight'){e.preventDefault();stop();draw(current+1)}};draw(0);
</script></html>
